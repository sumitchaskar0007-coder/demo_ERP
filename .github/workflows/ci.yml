name: Verify

on:
  pull_request:
  push:
    branches: [main, sai, sumit]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: college_erp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d college_erp"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/college_erp
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          FLYWAY_ENABLED: 'true'
          RATE_LIMIT_REDIS_ENABLED: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
        run: mvn -B verify
      - name: Apply and validate Flyway migrations on PostgreSQL
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: docker
          DB_URL: jdbc:postgresql://localhost:5432/college_erp
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_POOL_MAX_SIZE: '4'
          DB_POOL_MIN_IDLE: '0'
          FLYWAY_ENABLED: 'true'
          JWT_SECRET: ci-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJK
          RATE_LIMIT_KEY_SECRET: ci-only-rate-limit-key-0123456789-abcdefghijklmnopqrstuvwxyz
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
          REDIS_SSL_ENABLED: 'false'
          CACHE_ENVIRONMENT: ci-migration-validation
          MAIL_ENABLED: 'false'
          REPORT_EXPORTS_ENABLED: 'false'
          REPORT_DATABASE_POLL_ENABLED: 'false'
          REPORT_SQS_PRODUCER_ENABLED: 'false'
          REPORT_SQS_CONSUMER_ENABLED: 'false'
          FRONTEND_URL: http://localhost
          CORS_ALLOWED_ORIGINS: http://localhost
        run: >-
          timeout 120s java -jar target/college-erp-*.jar
          --app.migration-task=true --server.port=0
      - name: Backend dependency vulnerability scan
        # v0.36.0, pinned after the March 2026 Trivy action compromise.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          vuln-type: library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit --if-present
      - name: Browser smoke tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Production dependency audit
        working-directory: frontend
        run: npm run audit:production

  infrastructure:
    name: Infrastructure and image checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Validate ECS Terraform stack
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: Scan ECS Terraform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag college-erp-backend:${{ github.sha }} backend
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: college-erp-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks CLI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          sudo install --mode 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan complete Git history for secrets
        run: gitleaks git . --redact --no-banner --exit-code 1
