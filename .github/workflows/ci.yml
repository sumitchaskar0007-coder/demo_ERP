name: Verify

on:
  pull_request:
  push:
    branches: [main, sumit]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: college_erp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d college_erp"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/college_erp
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          FLYWAY_ENABLED: 'true'
          RATE_LIMIT_REDIS_ENABLED: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
        run: mvn -B verify
      - name: Apply and validate Flyway migrations on PostgreSQL
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: docker
          DB_URL: jdbc:postgresql://localhost:5432/college_erp
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_POOL_MAX_SIZE: '4'
          DB_POOL_MIN_IDLE: '0'
          FLYWAY_ENABLED: 'true'
          JWT_SECRET: ci-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJK
          RATE_LIMIT_KEY_SECRET: ci-only-rate-limit-key-0123456789-abcdefghijklmnopqrstuvwxyz
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
          REDIS_SSL_ENABLED: 'false'
          CACHE_ENVIRONMENT: ci-migration-validation
          MAIL_ENABLED: 'false'
          REPORT_EXPORTS_ENABLED: 'false'
          REPORT_DATABASE_POLL_ENABLED: 'false'
          REPORT_SQS_PRODUCER_ENABLED: 'false'
          REPORT_SQS_CONSUMER_ENABLED: 'false'
          FRONTEND_URL: http://localhost
          CORS_ALLOWED_ORIGINS: http://localhost
        run: >-
          timeout 120s java -jar target/college-erp-*.jar
          --app.migration-task=true --server.port=0
      - name: Dependency vulnerability scan
        working-directory: backend
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit --if-present
      - name: Browser smoke tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  infrastructure:
    name: Infrastructure and image checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Validate ECS Terraform stack
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate EC2 Terraform stack
        working-directory: infra/terraform-ec2
        run: terraform init -backend=false -input=false && terraform validate
      - name: Scan ECS Terraform
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform
          soft_fail: false
      - name: Scan review-only EC2 Terraform
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform-ec2
          soft_fail: false
      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag college-erp-backend:${{ github.sha }} backend
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: college-erp-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
