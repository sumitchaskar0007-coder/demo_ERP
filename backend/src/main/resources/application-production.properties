spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.rate-limit.redis-enabled=true
management.health.redis.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis,storage
app.auth.cookie-secure=true
app.upload-dir=${SHARED_STORAGE_DIR:/data/jadhavr-erp}/uploads
app.storage.admission-photo-dir=${SHARED_STORAGE_DIR:/data/jadhavr-erp}/admission-photos
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
