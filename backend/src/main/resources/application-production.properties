spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.datasource.url=${DB_URL}
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslrootcert=${DB_SSL_ROOT_CERT}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.super-admin.name=${SUPER_ADMIN_NAME:}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.phone=${SUPER_ADMIN_PHONE:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}

app.rate-limit.redis-enabled=true
app.rate-limit.required=true
app.rate-limit.fail-closed=true
app.rate-limit.key-secret=${RATE_LIMIT_KEY_SECRET}
app.auth.authorization-cache-enabled=${AUTHORIZATION_CACHE_ENABLED:true}
app.cache.redis-enabled=true
management.health.redis.enabled=true
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

app.mail.enabled=${MAIL_ENABLED:true}
spring.mail.host=${MAIL_HOST:disabled.invalid}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:disabled}
spring.mail.password=${MAIL_PASSWORD:disabled}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
app.mail.from-address=${MAIL_FROM_ADDRESS:noreply@invalid.example}
app.mail.reply-to=${MAIL_REPLY_TO:${MAIL_FROM_ADDRESS}}

# Keep exports closed in production until either the DB worker or the separate
# SQS producer/consumer services are explicitly configured.
app.reports.enabled=${REPORT_EXPORTS_ENABLED:false}
app.reports.database-poll-enabled=${REPORT_DATABASE_POLL_ENABLED:false}
app.reports.sqs.producer-enabled=${REPORT_SQS_PRODUCER_ENABLED:false}
app.reports.sqs.consumer-enabled=${REPORT_SQS_CONSUMER_ENABLED:false}
app.reports.sqs.queue-url=${REPORT_SQS_QUEUE_URL:}

app.aws.region=${AWS_REGION}
app.aws.private-upload-bucket=${AWS_PRIVATE_UPLOAD_BUCKET}
app.aws.secrets-name=${AWS_SECRETS_NAME}
app.storage.provider=s3
app.storage.presign.max-bytes=${ADMISSION_DOCUMENT_MAX_BYTES:2097152}
app.storage.presign.upload-expiry-seconds=${ADMISSION_UPLOAD_URL_EXPIRY_SECONDS:300}
app.storage.presign.download-expiry-seconds=${ADMISSION_DOWNLOAD_URL_EXPIRY_SECONDS:120}
app.storage.presign.pending-expiry-seconds=${ADMISSION_UPLOAD_COMPLETION_EXPIRY_SECONDS:900}
app.storage.presign.cleanup-delay-ms=${ADMISSION_UPLOAD_CLEANUP_DELAY_MS:300000}
app.storage.presign.cleanup-initial-delay-ms=${ADMISSION_UPLOAD_CLEANUP_INITIAL_DELAY_MS:60000}
management.endpoint.health.group.readiness.include=readinessState,db,redis,storage
app.auth.cookie-secure=true
app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.jakarta.persistence.query.timeout=${DB_QUERY_TIMEOUT_MS:5000}
spring.transaction.default-timeout=${DB_TRANSACTION_TIMEOUT_SECONDS:30}
