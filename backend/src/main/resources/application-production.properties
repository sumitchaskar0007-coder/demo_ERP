spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.super-admin.password=${SUPER_ADMIN_PASSWORD}

app.rate-limit.redis-enabled=true
app.cache.redis-enabled=true
management.health.redis.enabled=true
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

app.mail.enabled=true
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from-address=${MAIL_FROM_ADDRESS}
app.mail.reply-to=${MAIL_REPLY_TO:${MAIL_FROM_ADDRESS}}

app.aws.region=${AWS_REGION}
app.aws.private-upload-bucket=${AWS_PRIVATE_UPLOAD_BUCKET}
app.aws.secrets-name=${AWS_SECRETS_NAME}
management.endpoint.health.group.readiness.include=readinessState,db,redis,storage
app.auth.cookie-secure=true
app.upload-dir=${SHARED_STORAGE_DIR:/data/jadhavr-erp}/uploads
app.storage.admission-photo-dir=${SHARED_STORAGE_DIR:/data/jadhavr-erp}/admission-photos
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
