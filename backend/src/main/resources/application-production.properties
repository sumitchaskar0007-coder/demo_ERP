spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.datasource.url=${DB_URL}
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslrootcert=${DB_SSL_ROOT_CERT}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.super-admin.name=${SUPER_ADMIN_NAME:}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.phone=${SUPER_ADMIN_PHONE:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}

app.rate-limit.redis-enabled=true
app.rate-limit.fail-closed=true
app.rate-limit.key-secret=${RATE_LIMIT_KEY_SECRET}
app.cache.redis-enabled=true
management.health.redis.enabled=true
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

app.mail.enabled=true
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
app.mail.from-address=${MAIL_FROM_ADDRESS}
app.mail.reply-to=${MAIL_REPLY_TO:${MAIL_FROM_ADDRESS}}

app.aws.region=${AWS_REGION}
app.aws.private-upload-bucket=${AWS_PRIVATE_UPLOAD_BUCKET}
app.aws.secrets-name=${AWS_SECRETS_NAME}
app.storage.provider=s3
management.endpoint.health.group.readiness.include=readinessState,db,redis,storage
app.auth.cookie-secure=true
app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
