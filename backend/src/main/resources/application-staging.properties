# Staging uploads must use the same private S3 object-storage implementation as
# production. ECS also activates the production profile for all hardened runtime
# settings and validators; these values keep standalone staging-profile runs safe.
app.storage.provider=s3
app.aws.region=${AWS_REGION}
app.aws.private-upload-bucket=${AWS_PRIVATE_UPLOAD_BUCKET}
management.endpoint.health.group.readiness.include=readinessState,db,redis,storage
