<!doctype html>
<html>
<body style="font-family:Arial;background:#eef4ff;padding:24px">
<main style="max-width:600px;margin:auto;background:white;padding:28px;border-radius:16px">
  <h2>Jadhavar ERP</h2>
  <h3 th:text="${subject}">Principal account created</h3>
  <p>Hello <span th:text="${name}">Principal</span>, your Principal account for <b th:text="${college}">College</b> is ready.</p>
  <p><strong>Username:</strong> <span th:text="${username}">principal@example.com</span><br>
     <strong>Temporary password:</strong> <span th:text="${temporaryPassword}">temporary password</span></p>
  <p><a th:href="${url}" style="background:#2563eb;color:white;padding:12px 20px;text-decoration:none;border-radius:8px">Sign in and change password</a></p>
  <p style="font-size:12px" th:text="${url}"></p>
  <small>© <span th:text="${year}"></span> Jadhavar ERP</small>
</main>
</body>
</html>
