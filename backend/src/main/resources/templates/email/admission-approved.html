<!doctype html>
<html>
<body style="font-family:Arial;background:#eef4ff;padding:24px">
<main style="max-width:600px;margin:auto;background:white;padding:28px;border-radius:16px">
  <h2 style="color:#2563eb">College ERP Institute</h2>
  <h3 th:text="${subject}">Admission approved successfully</h3>
  <p>Hello <span th:text="${name}">Student</span>,</p>
  <p>Congratulations. Your admission has been approved successfully.</p>
  <p>Admission reference: <strong th:text="${admissionReferenceNumber}">ADM-REFERENCE</strong><br>
     Admission number: <strong th:text="${admissionNumber}">ADM-NUMBER</strong></p>
  <p><a th:href="${url}" style="background:#2563eb;color:white;padding:12px 20px;text-decoration:none;border-radius:8px">Open student dashboard</a></p>
  <hr>
  <small>© <span th:text="${year}"></span> College ERP Institute</small>
</main>
</body>
</html>
