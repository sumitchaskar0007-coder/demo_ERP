# Explicit, opt-in defaults for a developer workstation.
# Activate with: --spring.profiles.active=local
server.port=8081
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

app.bootstrap.enabled=true
app.bootstrap.reset-existing-password=true
app.super-admin.name=${SUPER_ADMIN_NAME:Super Admin}
app.super-admin.email=${SUPER_ADMIN_EMAIL:admin@erp.com}
app.super-admin.phone=${SUPER_ADMIN_PHONE:9999999999}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:Admin@123456}
