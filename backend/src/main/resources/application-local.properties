# Default developer environment. Docker Compose also uses this profile and
# overrides the database/migration/bootstrap values through environment variables.
app.environment=local
server.port=${SERVER_PORT:8081}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.flyway.enabled=${FLYWAY_ENABLED:false}

app.bootstrap.enabled=${BOOTSTRAP_ENABLED:true}
app.bootstrap.reset-existing-password=${BOOTSTRAP_RESET_EXISTING_PASSWORD:true}
app.super-admin.name=${SUPER_ADMIN_NAME:Super Admin}
app.super-admin.email=${SUPER_ADMIN_EMAIL:admin@erp.com}
app.super-admin.phone=${SUPER_ADMIN_PHONE:9999999999}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:Admin@123456}
