# Production-style Docker Compose profile for EC2-hosted containers.
# The existing "production" profile remains dedicated to RDS, S3, TLS Redis, and external HTTPS.

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}

app.jwt.secret=${JWT_SECRET}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}

app.rate-limit.redis-enabled=true
app.rate-limit.required=true
app.rate-limit.fail-closed=true
app.rate-limit.key-secret=${RATE_LIMIT_KEY_SECRET}
app.cache.redis-enabled=true
app.cache.environment=${CACHE_ENVIRONMENT:docker}
management.health.redis.enabled=true
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

app.storage.provider=${STORAGE_PROVIDER:local}
app.upload-dir=${UPLOAD_DIR:/app/uploads}

app.mail.enabled=${MAIL_ENABLED:false}
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:disabled}
spring.mail.password=${MAIL_PASSWORD:disabled}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
app.mail.from-address=${MAIL_FROM_ADDRESS:noreply@example.com}
app.mail.reply-to=${MAIL_REPLY_TO:${MAIL_FROM_ADDRESS:noreply@example.com}}

app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.super-admin.name=${SUPER_ADMIN_NAME:}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.phone=${SUPER_ADMIN_PHONE:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}

app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
management.endpoint.health.group.readiness.include=readinessState,db,redis,diskSpace

spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
