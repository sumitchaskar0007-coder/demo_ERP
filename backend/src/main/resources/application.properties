spring.application.name=college-erp

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/college_erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

spring.jpa.open-in-view=false
app.storage.admission-photo-dir=${ADMISSION_PHOTO_DIR:uploads/admission-photos}
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.admission-document-dir=${ADMISSION_DOCUMENT_DIR:uploads/admission-documents}
app.storage.payment-proof-dir=${PAYMENT_PROOF_DIR:uploads/payment-proofs}
app.attendance.grace-minutes=${ATTENDANCE_GRACE_MINUTES:0}
app.attendance.default-status=${ATTENDANCE_DEFAULT_STATUS:PRESENT}

server.port=${SERVER_PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
server.tomcat.threads.max=${SERVER_MAX_THREADS:200}
server.tomcat.threads.min-spare=${SERVER_MIN_SPARE_THREADS:10}
server.tomcat.accept-count=${SERVER_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:20s}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${UPLOAD_DIR:uploads}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.jwt.secret=${JWT_SECRET:CHANGE_THIS_SECRET_TO_A_LONG_RANDOM_SECRET_FOR_PRODUCTION}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.rate-limit.redis-enabled=${RATE_LIMIT_REDIS_ENABLED:false}
app.rate-limit.fail-closed=${RATE_LIMIT_FAIL_CLOSED:false}
app.rate-limit.key-secret=${RATE_LIMIT_KEY_SECRET:local-rate-limit-key}
management.health.redis.enabled=${RATE_LIMIT_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
app.cache.redis-enabled=${CACHE_REDIS_ENABLED:false}
app.cache.environment=${CACHE_ENVIRONMENT:local}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.1.4:5173}
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|127\\.0\\.0\\.1|::1}

app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.super-admin.name=${SUPER_ADMIN_NAME:}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.phone=${SUPER_ADMIN_PHONE:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}

# Destructive, explicit local load-test seeder. Never enable in normal startup.
app.large-demo.reset=${LARGE_DEMO_RESET:false}
app.large-demo.confirm=${LARGE_DEMO_CONFIRM:}
app.large-demo.password=${LARGE_DEMO_PASSWORD:}
app.large-demo.colleges=${LARGE_DEMO_COLLEGES:40}
app.large-demo.total-users=${LARGE_DEMO_TOTAL_USERS:200000}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from-address=${MAIL_FROM_ADDRESS:noreply@localhost}
app.mail.from-name=${MAIL_FROM_NAME:Jadhavar ERP}
app.mail.reply-to=${MAIL_REPLY_TO:noreply@localhost}
app.mail.max-retries=${MAIL_MAX_RETRIES:3}
app.mail.retry-delay-seconds=${MAIL_RETRY_DELAY_SECONDS:60}
app.mail.batch-size=${MAIL_BATCH_SIZE:20}
app.mail.token-expiry-minutes=${MAIL_TOKEN_EXPIRY_MINUTES:30}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
