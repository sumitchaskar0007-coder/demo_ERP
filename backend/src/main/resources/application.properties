spring.application.name=college-erp

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/college_erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
app.storage.admission-photo-dir=${ADMISSION_PHOTO_DIR:uploads/admission-photos}

server.port=${SERVER_PORT:8081}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${UPLOAD_DIR:uploads}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

management.endpoints.web.exposure.include=health
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

app.jwt.secret=${JWT_SECRET:CHANGE_THIS_SECRET_TO_A_LONG_RANDOM_SECRET_FOR_PRODUCTION}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.super-admin.name=${SUPER_ADMIN_NAME:Super Admin}
app.super-admin.email=${SUPER_ADMIN_EMAIL:admin@erp.com}
app.super-admin.phone=${SUPER_ADMIN_PHONE:9999999999}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:Admin@12345}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from-address=${MAIL_FROM_ADDRESS:noreply@localhost}
app.mail.from-name=${MAIL_FROM_NAME:Jadhavr ERP}
app.mail.reply-to=${MAIL_REPLY_TO:noreply@localhost}
app.mail.max-retries=${MAIL_MAX_RETRIES:3}
app.mail.retry-delay-seconds=${MAIL_RETRY_DELAY_SECONDS:60}
app.mail.batch-size=${MAIL_BATCH_SIZE:20}
app.mail.token-expiry-minutes=${MAIL_TOKEN_EXPIRY_MINUTES:30}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
