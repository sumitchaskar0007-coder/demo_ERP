spring.application.name=college-erp

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/college_erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
server.port=${SERVER_PORT:8081}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${UPLOAD_DIR:uploads}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET:CHANGE_THIS_SECRET_TO_A_LONG_RANDOM_SECRET_FOR_PRODUCTION}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.rate-limit.redis-enabled=${RATE_LIMIT_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.forward-headers-strategy=framework

app.super-admin.name=${SUPER_ADMIN_NAME:Super Admin}
app.super-admin.email=${SUPER_ADMIN_EMAIL:admin@erp.com}
app.super-admin.phone=${SUPER_ADMIN_PHONE:9999999999}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:Admin@12345}
